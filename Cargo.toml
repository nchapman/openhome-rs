[workspace]
resolver = "2"
members = [
    "crates/openhome-core",
    "crates/openhome-server",
    "crates/openhome-client",
    "crates/openhome-songcast",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/nchapman/openhome-rs"
keywords = ["openhome", "upnp", "audio", "songcast", "renderer"]
categories = ["multimedia::audio", "network-programming"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
openhome-core = { path = "crates/openhome-core", version = "0.1.0" }
openhome-server = { path = "crates/openhome-server", version = "0.1.0" }
openhome-client = { path = "crates/openhome-client", version = "0.1.0" }
openhome-songcast = { path = "crates/openhome-songcast", version = "0.1.0" }

bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
quick-xml = "0.37"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
uuid = { version = "1", features = ["v4", "v5"] }
